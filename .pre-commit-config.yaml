repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.0
    hooks:
      - id: mypy
        name: mypy (app, scripts)
        additional_dependencies: [types-flask]
        args: [--ignore-missing-imports]
        files: '^(app|scripts)/.*\.py$'
