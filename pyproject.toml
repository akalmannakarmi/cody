[project]
name = "cody"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask~=3.1",
    "flask-wtf~=1.2",
    "flask-talisman~=1.1",
    "flask-limiter~=3.12",
    "gunicorn~=26.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.12.0",
    "mypy~=1.17.0",
    "pre-commit>=4.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
